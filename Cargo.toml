[package]
name = "slint-rust-template"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["write-file-backend"]

[dependencies]
slint = { version = "=1.17.0", features = ["compat-1-2", "std", "renderer-software"], default-features = false }
i-slint-common = { version = "=1.17.0", features = ["fontconfig-dlopen"] }
write-file-backend = { path = "write-file-backend" }

[build-dependencies]
slint-build = "=1.17.0"

[profile.release]
codegen-units = 1
lto = true
